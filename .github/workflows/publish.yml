name: Publish package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-verifactu
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.2

jobs:
  publish:
    name: Validate, version and publish
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version --ignore-scripts
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Confirm main has not advanced
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main avanzó durante la validación; se cancela antes de publicar una versión obsoleta."
            exit 1
          fi
      - name: Commit version and tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:main --follow-tags
      - name: Use current npm for Trusted Publishing
        run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --provenance
